name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configura Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepara i file del sito
        run: |
          mkdir -p _site
          cp index.html styles.css theme-boot.js app.js views-core.js views-sections.js generators.js \
            sync-config.js sync-merge.js sync.js html-sanitize.js \
            data-lessons.js data-quiz.js data-english.js content-meta.js \
            manifest.webmanifest icon.svg apple-touch-icon.png icon-192.png icon-512.png \
            icon-192-maskable.png icon-512-maskable.png _site/

      - name: Carica l'artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
