name: Aggiornamento contenuti mensile

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Aggiorna i contenuti
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node scripts/update-content.mjs

      - name: Apri o aggiorna la pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-lessons.js data-quiz.js data-english.js content-meta.js
          if git diff --cached --quiet; then
            echo "Nessuna modifica da proporre."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="content-update-${DATE}"
          git commit -m "chore: aggiornamento contenuti ${DATE}"
          git fetch origin "${BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git push --force-with-lease="refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          if gh pr list --base main --head "${BRANCH}" --state open --json number --jq '.[0].number' | grep -q '^[0-9]'; then
            echo "Pull request già aperta su ${BRANCH}: aggiornata con il nuovo commit."
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: aggiornamento contenuti ${DATE}" \
              --body "Proposta automatica dei contenuti. Il merge su main pubblica il sito con il workflow Pages. Non unire se la diff non ti convince."
          fi
