name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verifica i secret Cloudflare
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID assenti: deploy del worker saltato."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installa Wrangler
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        env:
          CI: "true"
          NPM_CONFIG_YES: "true"
        run: npm install --no-fund --no-audit --no-save wrangler@4.157.0

      - name: Pubblica il worker
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.157.0"
          packageManager: npm
          command: deploy
